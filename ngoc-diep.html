<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi Ngọc Diệp 🪷</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Mali:wght@400;600&family=Be+Vietnam+Pro:wght@400;600&display=swap">
<style>
:root{--b1:#fff3f6;--b2:#ffd9e4;--ink:#7b3050;--soft:#b0627f;--gr:rgba(110,190,130,.55);--panel:rgba(255,255,255,.85);--line:rgba(123,48,80,.2);--btn:#e8528f;--btnink:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#2a1838;--b2:#150d26;--ink:#ffe6ef;--soft:#e9a6c4;--gr:rgba(60,140,90,.5);--panel:rgba(35,20,50,.88);--line:rgba(255,210,230,.25);--btn:#ff6aa8;--btnink:#2a0c1e;color-scheme:dark}}
:root[data-theme="dark"]{--b1:#2a1838;--b2:#150d26;--ink:#ffe6ef;--soft:#e9a6c4;--gr:rgba(60,140,90,.5);--panel:rgba(35,20,50,.88);--line:rgba(255,210,230,.25);--btn:#ff6aa8;--btnink:#2a0c1e;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 35%,var(--b1),var(--b2));overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.ground{position:fixed;left:0;right:0;bottom:0;height:16vh;background:linear-gradient(to top,var(--gr),transparent);opacity:0;transition:opacity 2s;pointer-events:none}
.ground.on{opacity:1}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;transition:opacity .9s,transform 1.1s}
.stage.gone{opacity:0;transform:scale(1.8);pointer-events:none}
.wish{font-family:"Dancing Script","Segoe Script",cursive;font-size:clamp(26px,6vw,38px);margin:0 0 14px;opacity:0;animation:fade 1.6s .5s forwards}
#bloom{background:none;border:0;padding:12px;cursor:pointer;border-radius:50%;opacity:0;animation:fade 1.6s 1.1s forwards,sway 5s 2.7s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
#bloom svg{width:240px;height:240px;display:block;filter:drop-shadow(0 0 10px rgba(255,110,170,.45));transition:transform .4s}
#bloom:hover svg,#bloom:focus-visible svg{animation:twinkle .7s ease-in-out infinite alternate}
#bloom:focus-visible{outline:2px dashed var(--soft)}
.p{transform:translate(0,22px) rotate(calc(var(--a) * .9)) scale(var(--s));transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}#bloom:hover .p,#bloom:focus-visible .p{transform:translate(0,22px) rotate(calc(var(--a) * 1.28)) scale(var(--s))}.rp{transform-box:fill-box;transform-origin:center;animation:rip 3.2s ease-out infinite}.rp.r2{animation-delay:1.6s}@keyframes rip{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.hov{font-size:15px;color:var(--soft);margin:6px 0 0;opacity:0;transition:opacity .6s;min-height:24px;letter-spacing:.02em}
@media (hover:hover){#bloom:hover~.hov,#bloom:focus-visible~.hov{opacity:1}}
@media (hover:none){.hov{animation:fade 1.5s 3s forwards}}
@keyframes fade{to{opacity:1}}
@keyframes sway{50%{transform:rotate(4deg)}0%,100%{transform:rotate(-4deg)}}
@keyframes twinkle{from{transform:scale(1);filter:brightness(1) drop-shadow(0 0 8px rgba(255,120,175,.4))}to{transform:scale(1.14);filter:brightness(1.3) drop-shadow(0 0 26px rgba(255,200,120,.95))}}
.lwrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;pointer-events:none;z-index:2}
.letter{pointer-events:auto;max-width:520px;width:100%;max-height:84vh;overflow-y:auto;background:#fffaf1;color:#4a3830;border-radius:6px;padding:34px 32px 28px;box-shadow:0 24px 70px rgba(60,20,40,.35),0 2px 0 rgba(0,0,0,.04);font-family:"Mali","Be Vietnam Pro",system-ui,sans-serif;font-size:clamp(15px,3.7vw,17px);line-height:1.85;visibility:hidden;opacity:0;transform:translateY(30px) rotate(-.8deg);transition:opacity 1s,transform 1.2s}
.letter.show{visibility:visible;opacity:1;transform:rotate(-.4deg)}
.letter>*{margin:0 0 14px;opacity:0}
.letter.show>*{animation:fade 1s both}
.letter .to{font-family:"Dancing Script","Segoe Script",cursive;font-size:clamp(26px,6.5vw,34px);line-height:1.3;color:#8a3a5c}
.letter .sign{white-space:pre-line;text-align:right;margin:20px 0 0;color:#8a3a5c}
.letter hr{border:0;border-top:1px dashed rgba(138,58,92,.3);margin:6px 0 16px}
#editBtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;z-index:5;display:none;font-size:18px;padding:0}
button.b{font:inherit;cursor:pointer;border:0;border-radius:999px;background:var(--btn);color:var(--btnink);padding:10px 20px;font-weight:600;font-size:14px}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:620px;margin:0 auto;max-height:88vh;overflow-y:auto;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .35s}
.panel.open{transform:none}
.panel label{display:block;font-size:12px;color:var(--soft);margin:10px 0 4px}
.panel input,.panel textarea{width:100%;font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.panel textarea{min-height:130px;resize:vertical}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--soft);margin:8px 0 0;line-height:1.5}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="ground" id="ground"></div>

<div class="stage" id="stage">
  <p class="wish" id="wish"></p>
  <button id="bloom" aria-label="Mở bông hoa"><svg id="svg" viewBox="-60 -60 120 120"></svg></button>
  <p class="hov" id="hov">Những điều tốt đẹp đang chờ đợi cậu</p>
</div>

<div class="lwrap"><div class="letter" id="letter"></div></div>

<button id="editBtn" class="b g" title="Đổi tên và lời thư" aria-label="Đổi tên và lời thư">✎</button>
<div class="panel" id="panel">
  <label for="inName">Tên người nhận</label><input id="inName" maxlength="40">
  <label for="inBody">Nội dung thư (cách đoạn bằng 1 dòng trống, {ten} = tên người nhận)</label><textarea id="inBody" maxlength="900"></textarea>
  <label for="inFrom">Tên người gửi (để trống nếu không muốn ký tên)</label><input id="inFrom" maxlength="40">
  <label for="inLink">Link để gửi</label><input id="inLink" readonly>
  <div class="row">
    <button class="b" id="replay">Xem lại từ đầu</button>
    <button class="b g" id="copyBtn">Sao chép link</button>
    <button class="b g" id="closeBtn">Đóng</button>
  </div>
  <p class="hint">Chỉnh xong bấm “Sao chép link” rồi gửi đi. Người nhận mở link sẽ không thấy nút chỉnh sửa.</p>
</div>

<script>
(function(){
var DEF_NAME="Ngọc Diệp";
var DEF_BODY="Đôi khi tớ nhớ lại những ngày tụi mình ngồi lê la hết buổi, kể mấy chuyện chẳng đâu vào đâu mà cười đến đau bụng. Lúc đó tớ đâu biết đó là những ngày đẹp nhất. Giờ mỗi người một việc, bận hơn, ít gặp hơn, nhưng mỗi lần nhắn cho cậu, tớ vẫn thấy mình như hồi đó.\n\nCậu là người đã thấy tớ lúc tệ nhất mà vẫn ở lại. Cậu biết những điều tớ chưa từng nói với ai, và chưa bao giờ làm tớ thấy phải giả vờ. Tớ nói không giỏi, nhưng tớ biết ơn điều đó rất nhiều.\n\nNhân ngày 20/10, tớ chúc cậu thật khỏe, thật bình yên, và được yêu thương nhiều như cách cậu vẫn yêu thương người khác. Dù sau này mình có thế nào, nhớ là luôn có một đứa ở đây, vẫn nhớ hết.\n\nCảm ơn cậu, vì đã lớn lên cùng tớ.";
var DEF_FROM="";
var $=function(i){return document.getElementById(i)};
var q=new URLSearchParams(location.search);
if(location.hash.length>1){try{new URLSearchParams(location.hash.slice(1)).forEach(function(v,k){if(!q.has(k))q.set(k,v)})}catch(e){}}
var name=q.get("ten")||DEF_NAME, body=q.get("loi")||DEF_BODY, from=q.get("tu")||DEF_FROM;
var creator=q.get("edit")==="1";

// ---- bông hoa nhỏ (SVG): đóa sen
(function(){
  var P='M0 0C-17 -10 -19 -36 0 -58C19 -36 17 -10 0 0Z',s,i,a;
  function g(id,c0,c1,c2){return '<linearGradient id="'+id+'" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="'+c0+'"/><stop offset=".45" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c2+'"/></linearGradient>'}
  function pet(ang,sc,f){return '<path class="p" d="'+P+'" fill="url(#'+f+')" stroke="#fff" stroke-opacity=".4" stroke-width=".6" style="--a:'+ang+'deg;--s:'+sc+'"/>'}
  s='<defs>'+g('gb','#fff1d6','#ffb0cc','#e9528d')+g('gm','#fff6e2','#ffc0d7','#f5729f')+g('gf','#fffbea','#ffd4e4','#ff8fb6')
   +'<radialGradient id="hl"><stop offset="0" stop-color="#ff9cc4" stop-opacity=".5"/><stop offset="1" stop-color="#ff9cc4" stop-opacity="0"/></radialGradient></defs>'
   +'<circle cy="-6" r="57" fill="url(#hl)"/>'
   +'<g fill="none" stroke="#fff" stroke-width="1"><ellipse class="rp" cy="34" rx="30" ry="5"/><ellipse class="rp r2" cy="34" rx="44" ry="8"/></g>';
  [-80,-54,-27,0,27,54,80].forEach(function(x){s+=pet(x,.95,'gb')});
  [-66,-40,-14,14,40,66].forEach(function(x){s+=pet(x,.86,'gm')});
  for(i=-16;i<=16;i+=4){s+='<circle cx="'+i+'" cy="'+(8-(1-i*i/256)*7).toFixed(1)+'" r="1.4" fill="#ffd54a"/>'}
  [-40,-14,14,40].forEach(function(x){s+=pet(x,.72,'gf')});
  [-22,0,22].forEach(function(x){s+=pet(x,.5,'gf')});
  for(i=0;i<6;i++){a=(20+i*62)*Math.PI/180;s+='<path d="M0 -5L1.3 -1.3L5 0L1.3 1.3L0 5L-1.3 1.3L-5 0L-1.3 -1.3Z" fill="#fff6c8" opacity=".2" transform="translate('+(Math.cos(a)*54).toFixed(1)+' '+(Math.sin(a)*54).toFixed(1)+')"><animate attributeName="opacity" values=".15;1;.15" dur="2.6s" begin="'+(i*.45)+'s" repeatCount="indefinite"/></path>'}
  $("svg").innerHTML=s;
})();

// ---- nội dung
function render(){
  $("wish").textContent="Một đóa sen nhỏ, gửi "+name;
  var L=$("letter");L.textContent="";
  function add(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;L.appendChild(e)}
  add("p","to","Gửi "+name+" của tớ,");
  add("p",null,"Mong những điều đẹp đẽ sẽ luôn nở bên cậu.");
  add("hr");
  body.replace(/\{ten\}/g,name).split(/\n\s*\n/).forEach(function(t){if(t.trim())add("p",null,t.trim())});
  if(from)add("p","sign","Thân mến,\n"+from);
  document.title="Gửi "+name+" 🪷";
}
render();

// ---- vườn hoa
var cv=$("cv"),ctx=cv.getContext("2d"),W=0,H=0,G=[],gStart=0,on=false,timer=0;
function resize(){var d=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
resize();addEventListener("resize",resize);
var PAL=[["#ffb3d1","#ff6fa5"],["#ff7eb6","#ff3d8b"],["#ff6b6b","#d62839"],["#fff4f8","#ffc2da"],["#ffe08a","#f4a300"],["#d6a3ff","#8e44d6"],["#ffae80","#f2622a"],["#a8dcff","#4aa8ee"]];
function back(t){var c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}
function petal(r){ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-r*.33,-r*.17,-r*.37,-r*.68,0,-r);ctx.bezierCurveTo(r*.37,-r*.68,r*.33,-r*.17,0,0)}
function head(x,y,r,n,c1,c2,rot){
  if(r<=0)return;ctx.save();ctx.translate(x,y);
  var i,g;
  for(i=0;i<n;i++){ctx.save();ctx.rotate(rot+i*6.2832/n);
    g=ctx.createLinearGradient(0,0,0,-r);g.addColorStop(0,c2);g.addColorStop(1,c1);
    ctx.fillStyle=g;petal(r);ctx.fill();ctx.restore()}
  for(i=0;i<n;i++){ctx.save();ctx.rotate(rot+3.1416/n+i*6.2832/n);
    ctx.fillStyle=c1;petal(r*.62);ctx.fill();ctx.fillStyle="rgba(255,255,255,.3)";ctx.fill();ctx.restore()}
  g=ctx.createRadialGradient(0,0,0,0,0,r*.17);g.addColorStop(0,"#fff3a6");g.addColorStop(1,"#f3a21f");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*.17,0,6.2832);ctx.fill();ctx.restore();
}
function makeGarden(){
  G=[];var n=Math.round(Math.min(Math.max(W/13,30),95));
  for(var i=0;i<n;i++){var ty=H*(.28+Math.random()*.64),p=PAL[Math.floor(Math.random()*PAL.length)];
    G.push({x:(i+Math.random())/n*W,ty:ty,R:9+ty/H*24*(.8+Math.random()*.5),n:5+Math.floor(Math.random()*4),c1:p[0],c2:p[1],rot:Math.random()*6.28,ph:Math.random()*6.28,d:Math.random()*2.6,lf:Math.random()<.5?-1:1})}
  G.sort(function(a,b){return a.ty-b.ty});
}
function drawG(f,now){
  var t=(now-gStart)/1000-f.d;if(t<0)return;
  var g=Math.min(t/1.5,1);g=1-Math.pow(1-g,3);
  var y=H+6+(f.ty-H-6)*g,x=f.x+Math.sin(now/1200+f.ph)*5*g;
  ctx.strokeStyle="#4f9a63";ctx.lineWidth=2+f.R/14;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(f.x,H+6);ctx.quadraticCurveTo(f.x,(H+y)/2,x,y);ctx.stroke();
  ctx.save();ctx.translate(f.x+(x-f.x)*.4,H+(y-H)*.55);ctx.rotate(f.lf*.8);
  ctx.fillStyle="#5aa66b";ctx.beginPath();ctx.ellipse(f.lf*8,0,9,3.5,0,0,6.2832);ctx.fill();ctx.restore();
  var b=Math.min(Math.max(t-1.2,0),1);
  head(x,y,f.R*back(b),f.n,f.c1,f.c2,f.rot+b*1.2+Math.sin(now/2500+f.ph)*.15);
}
function loop(now){
  ctx.clearRect(0,0,W,H);
  if(on)for(var i=0;i<G.length;i++)drawG(G[i],now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function open(){
  if(on)return;on=true;makeGarden();gStart=performance.now();
  $("stage").classList.add("gone");$("ground").classList.add("on");
  timer=setTimeout(function(){$("letter").classList.add("show");
    var k=$("letter").children;for(var i=0;i<k.length;i++)k[i].style.animationDelay=(.4+i*.7)+"s"},3700);
}
function replay(){
  clearTimeout(timer);on=false;G=[];
  $("letter").classList.remove("show");$("stage").classList.remove("gone");$("ground").classList.remove("on");
}
$("bloom").addEventListener("click",open);

// ---- chỉnh sửa
function link(){return location.href.split("#")[0].split("?")[0]+"?ten="+encodeURIComponent(name)+"&loi="+encodeURIComponent(body)+(from?"&tu="+encodeURIComponent(from):"")}
function apply(){
  name=$("inName").value.trim()||DEF_NAME;body=$("inBody").value.trim()||DEF_BODY;from=$("inFrom").value.trim();
  render();$("inLink").value=link();
  if($("letter").classList.contains("show")){var k=$("letter").children;for(var i=0;i<k.length;i++)k[i].style.animationDelay="0s"}
}
if(creator)$("editBtn").style.display="block";
$("editBtn").addEventListener("click",function(){$("inName").value=name;$("inBody").value=body;$("inFrom").value=from;$("inLink").value=link();$("panel").classList.add("open")});
$("closeBtn").addEventListener("click",function(){$("panel").classList.remove("open")});
$("replay").addEventListener("click",function(){apply();$("panel").classList.remove("open");replay()});
["inName","inBody","inFrom"].forEach(function(i){$(i).addEventListener("input",apply)});
$("copyBtn").addEventListener("click",function(){
  apply();var el=$("inLink"),b=$("copyBtn");
  function ok(){b.textContent="Đã sao chép ✓";setTimeout(function(){b.textContent="Sao chép link"},1800)}
  function fb(){el.focus();el.select();try{document.execCommand("copy");ok()}catch(e){b.textContent="Hãy copy ô link phía trên"}}
  try{navigator.clipboard.writeText(el.value).then(ok,fb)}catch(e){fb()}
});
})();
</script>
</body>
</html>
